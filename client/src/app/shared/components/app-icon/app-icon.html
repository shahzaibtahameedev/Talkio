<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    [attr.stroke-width]="strokeWidth()"
    stroke-linecap="round"
    stroke-linejoin="round"
    class="h-full w-full"
    aria-hidden="true"
>
    @switch (name()) {
        @case ("chats") {
            <path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z" />
        }
        @case ("calls") {
            <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"

            <circle cx="12" cy="12" r="9" stroke-dasharray="4 3.2" />
        }
        @case ("channels") {
            <path d="m3 11 18-5v12L3 14v-3Z" />
            <path d="M11.6 16.8a3 3 0 1 1-5.8-1.6" />

        @case ("communities") {

            <path d="M16 3.13a4 4 0 0 1 0 7.75" />

        @case ("settings") {
            <circle cx="12" cy="12" r="3" />

                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"
            />

            <path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9Z" />
            <path d="M18 16.5 18.8 18.7 21 19.5 18.8 20.3 18 22.5 17.2 20.3 15 19.5 17.2 18.7Z" />
        }
        @case ("photos") {
            <rect x="3" y="3" width="18" height="18" rx="2" />
            <circle cx="8.8" cy="8.8" r="1.8" />
            <path d="m21 15.5-4.5-4.5L5.5 22" />
        }
        @case ("search") {
            <circle cx="11" cy="11" r="7.5" />
            <path d="m20.5 20.5-4.2-4.2" />
        }
        @case ("new-chat") {
            <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
            <path d="M18.4 2.6a2.1 2.1 0 1 1 3 3L12 15l-4 1 1-4Z" />
        }
        @case ("menu") {
            <circle cx="12" cy="5" r="1.6" fill="currentColor" stroke="none" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none" />
            <circle cx="12" cy="19" r="1.6" fill="currentColor" stroke="none" />
        }
        @case ("video") {
            <path d="m22 8-6 4 6 4V8Z" />
            <rect x="2" y="6" width="14" height="12" rx="2" />
        }
        @case ("phone") {
            <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92Z"

            <path
                d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"
            />
        }
        @case ("emoji") {
            <circle cx="12" cy="12" r="9.5" />
            <path d="M8.2 14.2a4.6 4.6 0 0 0 7.6 0" />
            <circle cx="9" cy="9.6" r="1.1" fill="currentColor" stroke="none" />
            <circle cx="15" cy="9.6" r="1.1" fill="currentColor" stroke="none" />
        }
        @case ("mic") {
            <rect x="9" y="2" width="6" height="11" rx="3" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <path d="M12 19v3" />
        }
        @case ("send") {
            <path d="m22 2-7 20-4-9-9-4Z" />
            <path d="M22 2 11 13" />
        }
        @case ("check") {
            <path d="M20 6 9 17l-5-5" />
        }
        @case ("check-double") {
            <path d="M17.5 6 7.8 17 3.5 12.7" />
            <path d="m22 7-7.6 8.6" />
        }
        @case ("clock") {
            <circle cx="12" cy="12" r="9" />
            <path d="M12 6.6V12l3.4 2" />
        }
        @case ("alert") {
            <circle cx="12" cy="12" r="9" />
            <path d="M12 7.5v5.2" />
            <circle cx="12" cy="16.4" r="1.1" fill="currentColor" stroke="none" />
        }
        @case ("lock") {
            <rect x="4" y="10.5" width="16" height="10.5" rx="2.2" />
            <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5" />
        }
        @case ("chevron-down") {
            <path d="m6 9 6 6 6-6" />
        }
    }
